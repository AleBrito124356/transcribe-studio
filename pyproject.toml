[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe-studio"
version = "0.1.0"
description = "Turn any audio or video into a transcript, summary, chapters and subtitles (SRT/VTT)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alejandro Brito" }]
keywords = ["whisper", "transcription", "subtitles", "srt", "vtt", "summarization", "nvidia-nim"]
dependencies = ["faster-whisper>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
diarize = ["pyannote.audio>=3.1"]

[project.scripts]
transcribe-studio = "cli:main"

[project.urls]
Homepage = "https://github.com/AleBrito124356/transcribe-studio"
Repository = "https://github.com/AleBrito124356/transcribe-studio"

[tool.setuptools]
py-modules = ["cli"]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
